name : CI/CD pipeline
on:
  push:
    branches: 
      - Main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  cd:
  
    - name: Deploy to Render
      needs: ci

      runs-on: ubuntu-latest

      steps:

        - name: Trigger Render Deploy
          run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
